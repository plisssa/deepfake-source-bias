  - name: inpaint_p
    path: ${paths.repo_root}/data/raw/pairs_v2/inpaint
    use_subfolders: false
    group_mode: regex
    group_regex: '/([^/]+)\.jpg$'
    group_namespace: ffhq_src
  - name: stylegan_p
    path: ${paths.repo_root}/data/raw/pairs_v2/stylegan
    use_subfolders: false
    group_mode: regex
    group_regex: '/([^/]+)\.jpg$'
