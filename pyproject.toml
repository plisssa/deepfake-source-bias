[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-source-bias"
version = "1.0.0"
description = "Влияние источника данных и обработки изображений на качество детекторов дипфейков"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elizaveta Puzyreva" }]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.10",
    "optuna>=3.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "shap>=0.43",
    "lime>=0.2.0.1",
    "joblib>=1.3",
    "pyarrow>=14.0",
    "PyWavelets>=1.4",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "kagglehub>=0.3",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dl = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "ruff>=0.1.6",
    "black>=23.10",
    "isort>=5.12",
    "pre-commit>=3.5",
    "mypy>=1.6",
    "ipykernel>=6.26",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["deepfakes*"]
exclude = ["tests*", "legacy*", "notebooks*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy", "notebooks", ".venv", "mlruns", "reports"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "PIE", "RUF"]
ignore = [
    # Кириллица в русских докстрингах/комментариях — не «неоднозначные» символы
    "RUF001", "RUF002", "RUF003",
    # Осознанный стиль проекта: broad-except с логированием на I/O-границах,
    # dict()-литералы, zip без strict (длины гарантированы вызывающим кодом)
    "BLE001", "S110", "S112", "C408", "B905", "SIM108", "RUF007", "B007",
    # локальное время в журнале исследования (не распределённая система)
    "DTZ005",
]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "legacy/.*|notebooks/.*"

[tool.isort]
profile = "black"
line_length = 100
skip = ["legacy", "notebooks"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: тесты длительностью более 10 секунд",
    "needs_data: тесты, которым нужны внешние наборы данных",
    "needs_mlflow: тесты, которым нужен работающий сервер MLflow",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["legacy/", "notebooks/"]
